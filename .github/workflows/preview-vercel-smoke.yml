name: Smoke Vercel Root Lounge preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-vercel-smoke.yml'
      - 'scripts/shared-backend-browser.mjs'

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise first-run onboarding on Vercel preview
        env:
          ROOT_LOUNGE_URL: 'https://root-lounge-6yhcg1aka-wscott2k26s-projects.vercel.app/?_vercel_share=YmhhvT4rAXj4Lt6vsdiITAhfIN6XQhpM'
        run: node scripts/onboarding-browser.mjs
      - name: Prove anonymous Supabase shared session
        env:
          ROOT_LOUNGE_URL: 'https://root-lounge-6yhcg1aka-wscott2k26s-projects.vercel.app/?_vercel_share=YmhhvT4rAXj4Lt6vsdiITAhfIN6XQhpM'
        run: node scripts/shared-backend-browser.mjs
      - name: Exercise returning-user Vercel preview and APIs
        env:
          ROOT_LOUNGE_URL: 'https://root-lounge-6yhcg1aka-wscott2k26s-projects.vercel.app/?_vercel_share=YmhhvT4rAXj4Lt6vsdiITAhfIN6XQhpM'
          EXPECT_API: '1'
        run: node scripts/browser-smoke.mjs
