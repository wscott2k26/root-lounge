name: Validate Root Lounge rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'recovered-live/**'
      - 'api/**'
      - 'scripts/validate-rebuild.mjs'
      - '.github/workflows/validate-rebuild.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reconstructed shell contract
        run: node scripts/validate-rebuild.mjs
      - name: Check hardened recovered frontend JavaScript
        run: |
          node --check recovered-live/dom-utils.js
          node --check recovered-live/app1.js
          node --check recovered-live/app2.js
          node --check recovered-live/app3.js
          node --check recovered-live/gui.js
          node --check recovered-live/helper.js
      - name: Check rebuilt API JavaScript
        run: |
          node --check api/config.js
          node --check api/health.js
          node --check api/create-checkout-session.js
          node --check api/stripe-webhook.js
