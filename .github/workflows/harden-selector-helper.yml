name: Harden Root Lounge selector helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-selector-helper.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rename selector helper safely
        run: node scripts/harden-selector-helper.mjs
      - name: Verify JavaScript syntax
        run: |
          node --check recovered-live/app1.js
          node --check recovered-live/app2.js
          node --check recovered-live/app3.js
          node --check recovered-live/gui.js
      - name: Commit hardened production scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-live/app1.js recovered-live/app2.js recovered-live/app3.js recovered-live/gui.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden Root Lounge DOM selector helper namespace'
          git pull --rebase origin main
          git push origin HEAD:main
