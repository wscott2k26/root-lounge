name: Root Lounge social contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'recovered-live/social.js'
      - 'recovered-live/social.css'
      - 'scripts/social-contract.mjs'
      - '.github/workflows/social-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'recovered-live/social.js'
      - 'recovered-live/social.css'
      - 'scripts/social-contract.mjs'
      - '.github/workflows/social-contract.yml'

permissions:
  contents: read

jobs:
  social-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate premium social wiring
        run: node scripts/social-contract.mjs
      - name: Syntax check social runtime
        run: node --check recovered-live/social.js
