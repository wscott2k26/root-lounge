name: Live Supabase RLS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Supabase browser client
        run: npm install --no-save @supabase/supabase-js@2
      - name: Prove anonymous auth and RLS data paths
        run: node scripts/supabase-live-smoke.mjs
