name: Production config contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/config.js'
      - 'api/health.js'
      - 'scripts/supabase-live-smoke.mjs'
      - 'scripts/production-config-contract.mjs'
      - '.github/workflows/production-config-contract.yml'

permissions:
  contents: read

jobs:
  production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production Supabase project binding
        run: node scripts/production-config-contract.mjs
