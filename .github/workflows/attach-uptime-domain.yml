name: Attach Uptime Lounge Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-uptime-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: wscott2k26s-projects
      VERCEL_PROJECT: root-lounge
    steps:
      - name: Verify Vercel token is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository."
            exit 2
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Attach apex domain
        shell: bash
        run: |
          set -euo pipefail
          vercel domains add uptimelounge.com "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
      - name: Attach www domain
        shell: bash
        run: |
          set -euo pipefail
          vercel domains add www.uptimelounge.com "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
      - name: Inspect apex domain
        shell: bash
        run: |
          set -euo pipefail
          vercel domains inspect uptimelounge.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Inspect www domain
        shell: bash
        run: |
          set -euo pipefail
          vercel domains inspect www.uptimelounge.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
