name: Audit Root Lounge DOM bindings

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-dom-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate binding audit
        run: node scripts/audit-dom-bindings.mjs
      - name: Upload binding audit
        uses: actions/upload-artifact@v4
        with:
          name: root-lounge-dom-binding-audit
          path: recovered-live/dom-binding-audit.json
          if-no-files-found: error
          retention-days: 14
