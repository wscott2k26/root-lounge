name: Audit Root Lounge DOM bindings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-dom-bindings.mjs'
      - '.github/workflows/audit-dom.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate binding audit
        run: node scripts/audit-dom-bindings.mjs
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-live/dom-binding-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit recovered Root Lounge DOM bindings'
          git push
