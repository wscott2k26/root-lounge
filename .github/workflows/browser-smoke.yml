name: Browser smoke Root Lounge rebuild

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'recovered-live/**'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'recovered-live/**'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: root-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser runtimes
        run: |
          node --check recovered-live/app1.js
          node --check recovered-live/app2.js
          node --check recovered-live/app3.js
          node --check recovered-live/gui.js
          node --check recovered-live/social.js
          node --check recovered-live/demo-social.js
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start hardened Root Lounge locally
        run: |
          python3 -m http.server 4173 > /tmp/root-lounge-http.log 2>&1 &
          echo $! > /tmp/root-lounge-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/root-lounge-http.log
          exit 1
      - name: Exercise real browser flows
        run: node scripts/browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-lounge-browser-screenshots
          path: qa/screenshots
          if-no-files-found: warn
          retention-days: 14
